<!DOCTYPE html>
<title>navigator.pubky is available in secure contexts</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
test(() => {
  assert_true(window.isSecureContext);
  assert_true('pubky' in navigator);
  assert_true(navigator.pubky instanceof Pubky);
  assert_equals(navigator.pubky, navigator.pubky, 'SameObject');
  assert_equals(typeof navigator.pubky.requestSession, 'function');
}, 'navigator.pubky exists in a secure context');

test(() => {
  assert_equals(typeof PubkySession, 'function');
  assert_throws_js(TypeError, () => new PubkySession());
  assert_throws_js(TypeError, () => new Pubky());
}, 'Pubky and PubkySession are not constructible');

promise_test(async t => {
  await promise_rejects_js(t, TypeError, navigator.pubky.requestSession());
}, 'requestSession() requires scopes');
</script>
